[project]
name = "divemate-cli"
version = "0.1.0"
description = "Query and stats CLI for DiveMate .ddb (SQLite) logbooks"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# lark powers the `--query` filter language (parser frontend); plotext draws the
# coloured terminal charts (pinned to the stable 5.x API — 6.x is a rewrite)
dependencies = ["lark>=1.2", "plotext>=5.2,<6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
gdrive = ["google-auth>=2.0", "requests>=2.0"]

[project.scripts]
dmcli = "divemate.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["divemate"]

[tool.pytest.ini_options]
# anyio's pytest plugin is auto-loaded but unused here, and it emits a
# deprecation warning on newer pytest — disable it.
addopts = "-p no:anyio"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
# ambiguous-unicode: our chart glyphs/units (▬, °, ×, –, →) are intentional
ignore = ["RUF001", "RUF002", "RUF003"]
