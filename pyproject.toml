[project]
name = "divemate-cli"
version = "0.1.0"
description = "Query and stats CLI for DiveMate .ddb (SQLite) logbooks"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
gdrive = ["google-auth>=2.0", "requests>=2.0"]
# coloured dual-axis profile charts for `info --profile`; without it a plain
# ASCII chart is drawn instead. Pinned to the stable 5.x API (6.x is a rewrite).
charts = ["plotext>=5.2,<6"]

[project.scripts]
dmcli = "divemate.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["divemate"]
